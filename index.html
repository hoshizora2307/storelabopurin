<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>信州プリン｜Amazon1位・関東圏の道の駅で完売続出のなめらかプリン【公式】</title>
<meta name="description" content="信州の恵みだけで作った、なめらかプリン。Amazon通販ランキング1位、関東圏の道の駅で入荷即完売、NEXCO中日本のサービスエリアでも大人気。今だけの特別価格でお届けします。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFBF3; --paper-2:#FFF4DE; --ink:#241A0E; --sub:#5B4A34;
  --red:#C23B2A; --red-deep:#9C2A1E; --red-glow:rgba(194,59,42,.22);
  --caramel:#6B4A22; --caramel-soft:#8A6531;
  --gold-1:#8A6B33; --gold-2:#F1DA97; --gold-3:#C79A3E; --gold-4:#5A431F;
  --line:#E9DCC0; --cream-panel:#FFF9EE;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:"Zen Kaku Gothic New",sans-serif;line-height:1.8;-webkit-font-smoothing:antialiased;padding-bottom:64px}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.wrap{max-width:980px;margin:0 auto;padding:0 22px}
.jp{font-family:"Shippori Mincho B1",serif}
.num{font-family:"Inter",sans-serif}
b{font-weight:900}

.topbar{background:var(--ink);color:var(--gold-2);text-align:center;font-size:12.5px;letter-spacing:.06em;padding:8px 10px;font-weight:500}
.topbar b{color:#fff}

.head{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.head .wrap{display:flex;align-items:center;justify-content:space-between;padding:12px 22px}
.head .logo{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:19px;letter-spacing:.08em;color:var(--ink);display:flex;align-items:center;gap:8px}
.head .logo::before{content:"";width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--gold-2),var(--gold-1))}
.head .cta{background:var(--red);color:#fff;font-weight:700;font-size:13px;padding:10px 18px;border-radius:4px;letter-spacing:.03em;box-shadow:0 4px 14px var(--red-glow)}

.badge-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.medal{width:104px;text-align:center}
.medal .disc{width:88px;height:88px;border-radius:50%;margin:0 auto;position:relative;
  background:radial-gradient(circle at 35% 28%,var(--gold-2),var(--gold-3) 55%,var(--gold-1) 85%);
  border:3px solid var(--gold-4);display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 6px 16px rgba(90,67,31,.35), inset 0 0 0 2px rgba(255,255,255,.4)}
.medal .disc .top{font-family:"Inter";font-size:9.5px;font-weight:800;letter-spacing:.08em;color:#5A431F}
.medal .disc .mid{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:20px;color:#3A2A10;line-height:1.05}
.medal .disc .bot{font-family:"Inter";font-size:8.5px;font-weight:700;color:#5A431F;letter-spacing:.04em}
.medal .cap{margin-top:9px;font-size:11.5px;font-weight:700;color:var(--ink);line-height:1.5}
.medal .cap small{display:block;font-weight:400;color:var(--sub);font-size:10px;margin-top:2px}

.hero{padding:38px 0 30px;text-align:center;background:linear-gradient(180deg,var(--paper-2),var(--paper) 60%)}
.hero .eyebrow{display:inline-block;background:var(--ink);color:var(--gold-2);font-size:12px;letter-spacing:.12em;font-weight:700;padding:7px 16px;border-radius:999px;margin-bottom:18px}
.hero h1{font-size:clamp(32px,7.2vw,54px);font-weight:800;line-height:1.45;letter-spacing:.02em;color:var(--ink)}
.hero h1 mark{background:linear-gradient(transparent 62%,rgba(194,59,42,.22) 62%);color:var(--red-deep)}
.hero .sub{margin-top:14px;font-size:15px;color:var(--sub);font-weight:500}
.hero .badges{margin-top:26px}
.hero-shot{position:relative;max-width:340px;margin:26px auto 0}
.hero-shot img{width:100%;filter:drop-shadow(0 20px 30px rgba(90,60,20,.25))}
.hero-shot .ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:112%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(241,218,151,.55),transparent 68%);z-index:-1}
.cta-btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(180deg,var(--red),var(--red-deep));color:#fff;font-weight:800;
  font-size:17px;padding:18px 40px;border-radius:8px;box-shadow:0 10px 26px var(--red-glow),inset 0 1px 0 rgba(255,255,255,.25);
  letter-spacing:.03em;transition:.25s var(--ease)}
.cta-btn:hover{transform:translateY(-2px);box-shadow:0 14px 32px var(--red-glow)}
.cta-btn small{display:block;font-weight:500;font-size:11px;opacity:.85;letter-spacing:.04em}
.cta-wrap{margin-top:24px}
.cta-note{margin-top:10px;font-size:11.5px;color:var(--sub)}

.stock-live{display:inline-flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:10px 20px;box-shadow:0 3px 10px rgba(90,60,20,.08)}
.stock-live .line{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink)}
.stock-live .dot{width:8px;height:8px;border-radius:50%;background:#2E9E4F;flex:0 0 auto;position:relative}
.stock-live .dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;background:#2E9E4F;opacity:.4;animation:stockpulse 1.8s ease-out infinite}
.stock-live b{color:var(--red-deep)}
.stock-live .time{font-family:"Inter";font-weight:700;color:var(--sub)}
@keyframes stockpulse{0%{transform:scale(1);opacity:.5}100%{transform:scale(2.4);opacity:0}}
.stock-live-wrap{display:flex;justify-content:center;margin:18px 0}
.stock-live small{color:var(--sub);font-weight:400;font-size:11px}
@media(prefers-reduced-motion:reduce){.stock-live .dot::after{animation:none}}
.arrowdown{margin-top:6px;font-size:22px;color:var(--red);animation:bounce 1.6s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

.ticker{background:var(--ink);padding:14px 0}
.ticker .track{display:flex;flex-wrap:wrap;gap:14px 28px;justify-content:center;max-width:980px;margin:0 auto;padding:0 22px}
.ticker span{color:var(--gold-2);font-size:13px;font-weight:700;letter-spacing:.03em;display:inline-flex;align-items:center;gap:8px}
.ticker span::before{content:"★";color:var(--gold-3);flex:0 0 auto}

.sec{padding:58px 0}
.sec-head{text-align:center;margin-bottom:36px}
.sec-tag{display:inline-block;background:var(--red);color:#fff;font-size:11.5px;font-weight:700;letter-spacing:.1em;padding:5px 14px;border-radius:999px;margin-bottom:14px}
.sec-title{font-size:clamp(23px,4.4vw,32px);font-weight:800;letter-spacing:.02em;line-height:1.5}
.sec-title mark{background:linear-gradient(transparent 60%,var(--gold-2) 60%)}
.sec-lead{margin-top:12px;color:var(--sub);font-size:14.5px;max-width:560px;margin-left:auto;margin-right:auto}

.notice-banner{background:linear-gradient(160deg,#241A0E,#1a1108);padding:44px 0}
.notice-card{max-width:820px;margin:0 auto;background:linear-gradient(160deg,#fff,#FFF6E4);border:3px solid var(--gold-3);border-radius:14px;
  padding:32px 30px;text-align:center;box-shadow:0 16px 40px rgba(0,0,0,.3);position:relative}
.notice-card::before{content:"";position:absolute;inset:6px;border:1px solid var(--gold-2);border-radius:9px;pointer-events:none}
.notice-tag{display:inline-block;background:var(--red);color:#fff;font-size:12.5px;font-weight:800;letter-spacing:.1em;padding:6px 18px;border-radius:999px;margin-bottom:16px}
.notice-title{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:clamp(20px,3.6vw,28px);color:var(--ink);line-height:1.6;margin-bottom:14px}
.notice-title mark{background:linear-gradient(transparent 60%,var(--gold-2) 60%)}
.notice-body{font-size:14px;color:var(--sub);line-height:2;max-width:640px;margin:0 auto}
.notice-sub{margin-top:14px;font-size:12.5px;color:var(--sub)}
.notice-phone{display:inline-flex;align-items:center;gap:10px;margin-top:20px;background:var(--ink);color:#fff;padding:14px 30px;border-radius:8px;text-decoration:none}
.notice-phone .num{font-family:"Inter";font-weight:900;font-size:clamp(22px,4vw,30px);letter-spacing:.02em}
.notice-phone .ico{font-size:20px}
.notice-phone small{display:block;font-size:10.5px;font-weight:400;color:var(--gold-2);letter-spacing:.06em}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.reveal.in{opacity:1;transform:none}

.proofstack{display:flex;flex-direction:column;gap:16px}
.proof{display:flex;gap:18px;align-items:center;background:var(--cream-panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
.proof .pnum{flex:0 0 auto;width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--gold-2);display:flex;align-items:center;justify-content:center;font-family:"Inter";font-weight:800;font-size:20px}
.proof .ptxt b{display:block;font-size:16.5px;color:var(--ink);margin-bottom:4px}
.proof .ptxt span{font-size:13px;color:var(--sub)}
.proof .ptxt .fine{display:block;font-size:10.5px;color:#9a8b6f;margin-top:5px}

.why-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.why{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px}
.why .ico{width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;margin-bottom:10px}
.why h3{font-size:15.5px;font-weight:800;margin-bottom:6px}
.why p{font-size:13px;color:var(--sub)}

.logos{background:var(--paper-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.logos .wrap{display:flex;justify-content:space-around;align-items:center;flex-wrap:wrap;gap:26px;padding:30px 22px}
.logo-item{text-align:center;font-family:"Inter";}
.logo-item .biglabel{font-weight:900;font-size:19px;color:var(--ink)}
.logo-item .smalllabel{font-size:10.5px;color:var(--sub);letter-spacing:.06em;margin-top:2px}

.voices{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.voice{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px}
.stars{color:var(--gold-3);font-size:14px;letter-spacing:2px;margin-bottom:8px}
.voice p{font-size:13px;color:var(--ink);line-height:1.9}
.voice .who{margin-top:12px;display:flex;align-items:center;gap:10px}
.voice .who .av{width:34px;height:34px;border-radius:50%;background:var(--caramel-soft);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.voice .who span{font-size:11.5px;color:var(--sub)}

.compare{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.compare th,.compare td{padding:14px 12px;text-align:center;font-size:13px;border-bottom:1px solid var(--line)}
.compare th{background:var(--ink);color:var(--gold-2);font-weight:700;font-size:12.5px}
.compare td:first-child,.compare th:first-child{text-align:left;font-weight:700}
.compare tr:last-child td{border-bottom:none}
.compare .ok{color:var(--red);font-weight:800;font-size:16px}
.compare .ng{color:#B9AD8E}

.interview{background:#fff}
.interview-card{display:flex;gap:26px;align-items:flex-start;background:var(--cream-panel);border:1px solid var(--line);border-radius:14px;padding:30px}
.interview-avatar{flex:0 0 auto;width:72px;height:72px;border-radius:50%;background:linear-gradient(160deg,#F1DA97,#C79A3E);
  display:flex;align-items:center;justify-content:center;border:2px solid var(--gold-4)}
.interview-role{font-size:11.5px;color:var(--sub);letter-spacing:.04em;margin-top:10px}
.interview-role b{display:block;color:var(--ink);font-size:13.5px;margin-bottom:2px}
.interview-quote{font-family:"Shippori Mincho B1",serif;font-weight:700;font-size:20px;line-height:1.7;color:var(--ink);margin-bottom:16px}
.interview-body p{font-size:13.5px;color:var(--sub);line-height:2;margin-bottom:12px}
.interview-side{flex:0 0 140px;text-align:center}

.stargaze{margin-top:22px;background:linear-gradient(160deg,#1A2748,#101B34);border-radius:12px;padding:26px 24px;position:relative;overflow:hidden}
.stargaze::before{content:"";position:absolute;inset:0;background-image:
    radial-gradient(1.5px 1.5px at 20% 30%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 70% 20%,#fff,transparent),
    radial-gradient(1px 1px at 40% 70%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 85% 60%,#fff,transparent),
    radial-gradient(1px 1px at 55% 45%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 10% 80%,#fff,transparent),
    radial-gradient(1px 1px at 90% 85%,#fff,transparent);
  opacity:.7}
.stargaze .tag{position:relative;display:inline-block;background:var(--gold-2);color:#3A2A10;font-size:11px;font-weight:800;padding:4px 12px;border-radius:999px;margin-bottom:10px}
.stargaze p{position:relative;color:#E7DCC0;font-size:13.5px;line-height:2}
.stargaze b{color:#fff}

.trust-mini{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-bottom:28px}
.trust-mini div{background:var(--cream-panel);border:1px solid var(--line);border-radius:8px;padding:10px 18px;font-size:13px;font-weight:700;text-align:center}
.trust-mini small{display:block;font-weight:400;color:var(--sub);font-size:10.5px;margin-top:2px}
@media(max-width:760px){.interview-card{flex-direction:column;align-items:center;text-align:center}}
.prod-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.prod{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.prod.best{border-color:var(--red);box-shadow:0 8px 22px rgba(194,59,42,.16)}
.prod .ribbon{position:absolute;top:12px;left:-6px;background:var(--red);color:#fff;font-size:11px;font-weight:800;padding:5px 14px 5px 18px;letter-spacing:.03em;z-index:2}
.prod .ribbon::after{content:"";position:absolute;left:0;bottom:-6px;border-width:6px 0 0 6px;border-style:solid;border-color:transparent transparent transparent var(--red-deep)}
.prod .shot{height:170px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--paper-2),#fff);overflow:hidden}
.prod .shot img{width:46%;max-height:150px;object-fit:contain}
.prod .body{padding:18px 18px 22px;display:flex;flex-direction:column;flex:1}
.prod h3{font-size:16px;font-weight:800}
.prod p{font-size:12px;color:var(--sub);margin-top:6px;flex:1}
.prod .price{margin-top:12px}
.prod .price .was{font-size:12px;color:#A79A7C;text-decoration:line-through}
.prod .price .now{font-family:"Inter";font-weight:900;font-size:23px;color:var(--red-deep)}
.prod .price .now small{font-size:12px;font-weight:600;color:var(--sub)}
.prod .buy{margin-top:12px;text-align:center;background:var(--ink);color:#fff;font-weight:700;font-size:13px;padding:11px;border-radius:6px}

.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.step3{text-align:center;position:relative}
.step3 .sc{width:48px;height:48px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-family:"Inter";font-weight:800;font-size:19px;margin:0 auto 12px}
.step3 h4{font-size:14.5px;font-weight:800;margin-bottom:6px}
.step3 p{font-size:12.5px;color:var(--sub)}

.cake-illust{width:64%;position:relative}
.cake-illust .top{width:100%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,#E8C87A 0%,#B9812E 38%,#5B3A16 62%,#2B1B0A 82%,#160D05 100%);
  box-shadow:inset 0 -6px 10px rgba(0,0,0,.35), 0 8px 14px rgba(60,40,10,.3)}
.cake-illust .side{width:100%;height:16px;margin-top:-8px;border-radius:0 0 50% 50%/0 0 60% 60%;
  background:linear-gradient(180deg,#3A260F,#241505)}
.prod .ribbon.gold{background:var(--gold-3);color:#3A2A10}
.prod .ribbon.gold::after{border-color:transparent transparent transparent var(--gold-4)}
.prod .badge-mini{position:absolute;top:12px;right:10px;background:var(--gold-3);color:#3A2A10;font-size:10px;font-weight:800;
  padding:4px 9px;border-radius:999px;z-index:2;border:1px solid var(--gold-4)}
.faq{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;background:#fff;overflow:hidden}
.faq summary{list-style:none;cursor:pointer;padding:16px 44px 16px 18px;font-weight:700;font-size:14px;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:20px;color:var(--red);font-weight:700}
.faq[open] summary::after{content:"–"}
.faq .a{padding:0 18px 18px;font-size:13px;color:var(--sub);line-height:1.9}

.final{background:linear-gradient(180deg,var(--ink),#1a1108);color:#fff;text-align:center}
.final .sec-title{color:#fff}
.final .sec-lead{color:#D8C9A6}
.final .badge-row{margin:26px 0 30px}

.stickycta{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.stickycta .info b{display:block;font-size:13px}
.stickycta .info span{font-size:11px;color:var(--sub)}
.stickycta .cta-btn{padding:12px 24px;font-size:14px;white-space:nowrap}

.foot{background:#1a1108;color:#B6A578;padding:40px 0 90px;font-size:12px}
.foot .wrap{display:flex;flex-wrap:wrap;gap:26px;justify-content:space-between}
.foot h5{color:var(--gold-2);font-size:11px;letter-spacing:.1em;margin-bottom:10px}
.foot ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.foot a.link-soon{opacity:.55;cursor:default}
.foot .base{margin-top:26px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#8A7B5C}

@media(max-width:760px){
  .why-grid,.voices,.prod-grid,.steps3{grid-template-columns:1fr}
  .logos .wrap{gap:20px 34px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important}}
</style>
</head>
<body>

<div class="topbar"><b>クール便でお届け</b>（送料500円）／ご注文から中3日以内に出荷（お届け日指定OK）</div>

<header class="head">
  <div class="wrap">
    <a href="#top" class="logo">信州プリン</a>
    <a href="#buy" class="cta">今すぐ購入</a>
  </div>
</header>

<section class="hero" id="top">
  <div class="wrap">
    <span class="eyebrow">信州マルシェ 公式ショップ</span>
    <h1 class="jp">なぜ、<mark>ただのプリン</mark>が<br>売り切れ続出なのか。</h1>
    <p class="sub">八ヶ岳の牛乳、厳選した生クリーム、信州の採れたて卵、そして砂糖。<br>たった4つの素材でつくる、なめらかプリン。</p>
